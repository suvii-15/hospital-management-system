<!DOCTYPE html>
<html>
<head>
    <title>Doctors Management</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f8fb;
            margin:0;
        }

        .header{
            background:linear-gradient(90deg,#0d6efd,#0dcaf0);
            color:white;
            padding:15px 25px;
            display:flex;
            justify-content:space-between;
        }

        .container{
            padding:30px;
        }

        input{
            padding:8px;
            margin:5px;
        }

        button{
            padding:8px 14px;
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
            background:white;
        }

        th,td{
            padding:10px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#198754;
            color:white;
        }

        .delete{
            background:red;
        }
    </style>
</head>

<body onload="loadDoctors()">

<div class="header">
    <h2>Doctors Management</h2>
    <button onclick="logout()">Logout</button>
</div>

<div class="container">

    <form onsubmit="addDoctor(event)">
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="specialization" placeholder="Specialization" required>
        <input type="number" id="experience" placeholder="Experience (yrs)" required>
        <input type="text" id="phone" placeholder="Phone" required>
        <input type="text" id="room" placeholder="Room No" required>
        <button>Add Doctor</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialization</th>
                <th>Experience</th>
                <th>Phone</th>
                <th>Room</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="doctorTable"></tbody>
    </table>

</div>

<script>

async function loadDoctors(){

    const res = await fetch("http://localhost:3000/doctors");
    const doctors = await res.json();

    let html = "";

    doctors.forEach(d=>{
        html += `
        <tr>
            <td>${d.doctor_id}</td>
            <td>${d.name}</td>
            <td>${d.specialization}</td>
            <td>${d.experience} yrs</td>
            <td>${d.phone}</td>
            <td>${d.room}</td>
            <td>
                <button class="delete" onclick="deleteDoctor(${d.doctor_id})">Delete</button>
            </td>
        </tr>`;
    });

    document.getElementById("doctorTable").innerHTML = html;
}

async function addDoctor(e){
    e.preventDefault();

    const data={
        name:document.getElementById("name").value,
        specialization:document.getElementById("specialization").value,
        experience:document.getElementById("experience").value,
        phone:document.getElementById("phone").value,
        room:document.getElementById("room").value
    };

    await fetch("http://localhost:3000/doctors",{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    loadDoctors();
}

async function deleteDoctor(id){

    if(confirm("Delete doctor?")){
        await fetch(`http://localhost:3000/doctors/${id}`,{
            method:"DELETE"
        });

        loadDoctors();
    }
}

function logout(){
    window.location="login.html";
}

</script>

</body>
</html>
