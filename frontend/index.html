<!DOCTYPE html>
<html>
<head>
<title>CarePlus Hospital Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins, sans-serif;
}

/* BACKGROUND */
body{
    height:100vh;
    background:linear-gradient(rgba(13,110,253,0.4),rgba(13,202,240,0.4)),
    url("https://images.unsplash.com/photo-1587351021759-3e566b3db4f6?auto=format&fit=crop&w=1500&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* LOGIN CARD */
.container{
    width:360px;
    backdrop-filter:blur(14px);
    background:rgba(255,255,255,0.15);
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
    color:white;
}

/* LOGO */
.logo{
    font-size:28px;
    font-weight:600;
    margin-bottom:10px;
}
.logo span{
    color:#ffdd57;
}

.subtitle{
    font-size:14px;
    margin-bottom:25px;
}

/* INPUT */
.inputBox{
    position:relative;
    margin:15px 0;
}
.inputBox input{
    width:100%;
    padding:12px 40px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:14px;
}
.inputBox i{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#0d6efd;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    background:linear-gradient(90deg,#0d6efd,#0dcaf0);
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}
button:hover{
    transform:scale(1.05);
}

/* ERROR */
#error{
    margin-top:12px;
    color:#ffb3b3;
    font-size:14px;
}
</style>

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div class="container">

<div class="logo">🏥 Care<span>Plus</span></div>
<div class="subtitle">Hospital Management System</div>

<form onsubmit="login(event)">

<div class="inputBox">
<i class="fa fa-user"></i>
<input id="username" placeholder="Enter Username" required>
</div>

<div class="inputBox">
<i class="fa fa-lock"></i>
<input id="password" type="password" placeholder="Enter Password" required>
</div>

<button onclick="login(event)">Login</button>
<div id="error"></div>

</form>
</div>

<script>
async function login(event){
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const response = await fetch("http://hospital-management-system-iy28.onrender.com/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({username,password})
    });

    const data = await response.json();

    if(data.token){
        // SAVE LOGIN SESSION
        localStorage.setItem("token", data.token);
        localStorage.setItem("hospitalUser", username);

        // GO DASHBOARD
        window.location.href = "dashboard.html";
    }
    else{
        document.getElementById("error").innerText="Invalid Username or Password";
    }
}
</script>

</body>
</html>
