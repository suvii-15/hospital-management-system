<!DOCTYPE html>
<html>
<head>
<title>Hospital Dashboard</title>
<script src="js/auth.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Poppins;
    background:#f4f8fb;
}

/* HEADER */
.header{
    background:linear-gradient(90deg,#0d6efd,#0dcaf0);
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logout{
    background:white;
    color:#0d6efd;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

/* DASHBOARD CARDS */
.container{
    padding:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 8px 18px rgba(0,0,0,0.1);
    transition:0.3s;
    cursor:pointer;
}
.card:hover{
    transform:translateY(-8px);
}

.icon{
    font-size:40px;
    margin-bottom:10px;
}

.patients{color:#0d6efd;}
.doctors{color:#20c997;}
.appointments{color:#ffc107;}
.bills{color:#dc3545;}

h2{margin:10px 0 5px;}
</style>

<script src="auth.js"></script>
</head>

<body onload="checkLogin()">

<div class="header">
<h2>🏥 CarePlus Hospital Dashboard</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card" onclick="location='patients.html'">
<div class="icon patients">🧑‍⚕️</div>
<h2>Patients</h2>
<p>Manage patient records</p>
</div>

<div class="card" onclick="location='doctors.html'">
<div class="icon doctors">👨‍⚕️</div>
<h2>Doctors</h2>
<p>View doctor details</p>
</div>

<div class="card" onclick="location='appointments.html'">
<div class="icon appointments">📅</div>
<h2>Appointments</h2>
<p>Schedule visits</p>
</div>

<div class="card" onclick="location='bills.html'">
<div class="icon bills">💳</div>
<h2>Billing</h2>
<p>Payment & invoices</p>
</div>

</div>
<script>
async function loadDashboard(){

    const res = await fetch("http://localhost:3000/dashboard");
    const data = await res.json();

    document.getElementById("patients").innerText = data.patients;
    document.getElementById("doctors").innerText = data.doctors;
    document.getElementById("appointments").innerText = data.appointments;
    document.getElementById("today").innerText = data.todayAppointments;
    document.getElementById("revenue").innerText = data.revenue;
}

loadDashboard();
</script>

</body>
</html>
